name: N9C-A Controller Verification

on:
  push:
    branches:
      - temp/n9c-a-controller-verify-20260904

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Compile fdroidFullDebug production Kotlin
        run: |
          unset _JAVA_OPTIONS
          unset JAVA_TOOL_OPTIONS
          ./gradlew \
            :app:compileFdroidFullDebugKotlin \
            --no-daemon \
            --stacktrace

      - name: Run N9A and N9C-A targeted tests
        run: |
          unset _JAVA_OPTIONS
          unset JAVA_TOOL_OPTIONS
          ./gradlew \
            :app:testFdroidFullDebugUnitTest \
            --tests 'com.celzero.bravedns.core.proxy.policy.InspectionUserAppPolicyRepositoryTest' \
            --tests 'com.celzero.bravedns.core.proxy.policy.InspectionAppPolicyControllerTest' \
            --no-daemon \
            --stacktrace

      - name: Verify targeted JUnit totals
        run: |
          python3 - <<'PY'
          import glob
          import sys
          import xml.etree.ElementTree as ET

          files = glob.glob(
              "app/build/test-results/"
              "testFdroidFullDebugUnitTest/TEST-*.xml"
          )

          tests = 0
          failures = 0
          errors = 0
          skipped = 0

          for path in files:
              root = ET.parse(path).getroot()
              tests += int(root.attrib.get("tests", 0))
              failures += int(root.attrib.get("failures", 0))
              errors += int(root.attrib.get("errors", 0))
              skipped += int(root.attrib.get("skipped", 0))

          print(f"N9CA_TESTS={tests}")
          print(f"N9CA_FAILURES={failures}")
          print(f"N9CA_ERRORS={errors}")
          print(f"N9CA_SKIPPED={skipped}")

          if (
              tests != 14
              or failures != 0
              or errors != 0
              or skipped != 0
          ):
              sys.exit(1)
          PY
