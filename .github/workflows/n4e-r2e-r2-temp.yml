name: N4E R2E R2 Temporary Verification

on:
  push:
    branches:
      - temp/n4e-r2e-r2-gha-20260904

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Remove local Java home override
        run: sed -i '/org.gradle.java.home/d' gradle.properties

      - name: Compile fdroidFull debug production Kotlin
        run: |
          ./gradlew \
            :app:compileFdroidFullDebugKotlin \
            --no-daemon \
            --console=plain \
            --stacktrace

      - name: Run BravePackageChangeReceiver targeted tests
        timeout-minutes: 15
        run: |
          ./gradlew \
            :app:testFdroidFullDebugUnitTest \
            --tests "com.celzero.bravedns.receiver.BravePackageChangeReceiverTest" \
            --no-daemon \
            --console=plain \
            --info \
            --stacktrace

      - name: Show target JUnit XML
        if: always()
        run: |
          XML="app/build/test-results/testFdroidFullDebugUnitTest/TEST-com.celzero.bravedns.receiver.BravePackageChangeReceiverTest.xml"
          if [ -f "$XML" ]; then
            cat "$XML"
          else
            echo "TARGET_JUNIT_XML_ABSENT"
          fi

      - name: Upload targeted test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: n4e-r2e-r2-test-results
          if-no-files-found: warn
          path: |
            app/build/test-results/testFdroidFullDebugUnitTest/**
            app/build/reports/tests/testFdroidFullDebugUnitTest/**