name: N9B User App Policy Temporary Verification

on:
  push:
    branches:
      - temp/n9b-user-app-policy-20260904

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Compile fdroidFullDebug production Kotlin
        run: ./gradlew :app:compileFdroidFullDebugKotlin --no-daemon --stacktrace

      - name: Run targeted N9A repository tests
        run: >
          ./gradlew
          :app:testFdroidFullDebugUnitTest
          --tests
          "com.celzero.bravedns.core.proxy.policy.InspectionUserAppPolicyRepositoryTest"
          --no-daemon
          --stacktrace

      - name: Verify targeted JUnit result
        shell: bash
        run: |
          python3 - <<'PY'
          import glob
          import sys
          import xml.etree.ElementTree as ET

          files = glob.glob(
              "app/build/test-results/testFdroidFullDebugUnitTest/*.xml"
          )

          if not files:
              print("N9B_JUNIT_XML=NOT_FOUND")
              sys.exit(1)

          tests = 0
          failures = 0
          errors = 0
          skipped = 0

          for path in files:
              root = ET.parse(path).getroot()
              tests += int(root.attrib.get("tests", 0))
              failures += int(root.attrib.get("failures", 0))
              errors += int(root.attrib.get("errors", 0))
              skipped += int(root.attrib.get("skipped", 0))

          print(f"N9B_TESTS={tests}")
          print(f"N9B_FAILURES={failures}")
          print(f"N9B_ERRORS={errors}")
          print(f"N9B_SKIPPED={skipped}")

          if (tests, failures, errors, skipped) != (6, 0, 0, 0):
              sys.exit(1)
          PY
