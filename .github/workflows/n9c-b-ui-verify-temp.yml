name: N9C-B UI Verification

on:
  push:
    branches:
      - temp/n9c-b-ui-verify-20260904

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Neutralize local Windows Gradle Java home
        shell: bash
        run: |
          echo "Before:"
          grep -n '^org\.gradle\.java\.home=' gradle.properties || true

          sed -i \
            '/^org\.gradle\.java\.home=/d' \
            gradle.properties

          echo "After:"
          if grep -n '^org\.gradle\.java\.home=' gradle.properties; then
            echo "N9CB_JAVA_HOME_NEUTRALIZED=NO"
            exit 1
          fi

          echo "N9CB_JAVA_HOME_NEUTRALIZED=YES"
          echo "JAVA_HOME=$JAVA_HOME"
          java -version

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Compile fdroidFullDebug production Kotlin
        run: >
          ./gradlew
          :app:compileFdroidFullDebugKotlin
          --no-daemon
          --stacktrace

      - name: Run sealed N9 targeted tests
        run: >
          ./gradlew
          :app:testFdroidFullDebugUnitTest
          --tests
          "com.celzero.bravedns.core.proxy.policy.InspectionUserAppPolicyRepositoryTest"
          --tests
          "com.celzero.bravedns.core.proxy.policy.InspectionAppPolicyControllerTest"
          --no-daemon
          --stacktrace

      - name: Verify targeted JUnit totals
        shell: bash
        run: |
          python3 - <<'PY'
          import glob
          import sys
          import xml.etree.ElementTree as ET

          files = glob.glob(
              "app/build/test-results/"
              "testFdroidFullDebugUnitTest/*.xml"
          )

          if not files:
              print("N9CB_JUNIT_XML=NOT_FOUND")
              sys.exit(1)

          tests = 0
          failures = 0
          errors = 0
          skipped = 0

          for path in files:
              root = ET.parse(path).getroot()
              tests += int(root.attrib.get("tests", 0))
              failures += int(root.attrib.get("failures", 0))
              errors += int(root.attrib.get("errors", 0))
              skipped += int(root.attrib.get("skipped", 0))

          print(f"N9CB_TESTS={tests}")
          print(f"N9CB_FAILURES={failures}")
          print(f"N9CB_ERRORS={errors}")
          print(f"N9CB_SKIPPED={skipped}")

          if (tests, failures, errors, skipped) != (14, 0, 0, 0):
              sys.exit(1)
          PY

      - name: Assemble fdroidFullDebug APK
        run: >
          ./gradlew
          :app:assembleFdroidFullDebug
          --no-daemon
          --stacktrace

      - name: Verify universal APK
        shell: bash
        run: |
          APK="app/build/outputs/apk/fdroidFull/debug/app-fdroid-full-universal-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "N9CB_UNIVERSAL_APK_PRESENT=NO"
            exit 1
          fi

          echo "N9CB_UNIVERSAL_APK_PRESENT=YES"
          echo "N9CB_APK_PATH=$APK"
          echo "N9CB_APK_SIZE_BYTES=$(stat -c%s "$APK")"
          echo "N9CB_APK_SHA256=$(sha256sum "$APK" | awk '{print $1}')"

      - name: Upload fdroidFullDebug universal APK
        uses: actions/upload-artifact@v4
        with:
          name: n9c-b-fdroid-universal-apk
          path: app/build/outputs/apk/fdroidFull/debug/app-fdroid-full-universal-debug.apk
          if-no-files-found: error
          retention-days: 7
