name: N9 R4B2 Force-TCP Verify

on:
  push:
    branches:
      - temp/n9-r4b2-force-tcp-verify-20260906

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Prepare Gradle
        run: |
          chmod +x gradlew
          sed -i '/org.gradle.java.home/d' gradle.properties

      - name: R4A targeted unit tests
        run: |
          ./gradlew \
            :app:testFdroidFullDebugUnitTest \
            --tests "com.celzero.bravedns.core.proxy.policy.InspectionTransportPolicyTest" \
            --no-daemon

      - name: Verify exact R4A test result
        run: |
          python3 - <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          path = (
              "app/build/test-results/testFdroidFullDebugUnitTest/"
              "TEST-com.celzero.bravedns.core.proxy.policy."
              "InspectionTransportPolicyTest.xml"
          )

          root = ET.parse(path).getroot()

          tests = int(root.attrib.get("tests", 0))
          failures = int(root.attrib.get("failures", 0))
          errors = int(root.attrib.get("errors", 0))
          skipped = int(root.attrib.get("skipped", 0))

          print(
              f"R4A_TEST_RESULT tests={tests} "
              f"failures={failures} errors={errors} skipped={skipped}"
          )

          if (tests, failures, errors, skipped) != (11, 0, 0, 0):
              sys.exit(1)
          PY

      - name: Compile fdroidFullDebug
        run: |
          ./gradlew \
            :app:compileFdroidFullDebugKotlin \
            --no-daemon

      - name: Assemble fdroidFullDebug
        run: |
          ./gradlew \
            :app:assembleFdroidFullDebug \
            --no-daemon

      - name: APK identity
        run: |
          find app/build/outputs/apk/fdroidFull/debug \
            -type f -name "*universal*.apk" \
            -print \
            -exec sha256sum {} \;

      - name: Upload verification artifact
        uses: actions/upload-artifact@v4
        with:
          name: n9-r4b2-force-tcp-fdroid-universal-${{ github.sha }}
          path: |
            app/build/outputs/apk/fdroidFull/debug/*universal*.apk
            app/build/test-results/testFdroidFullDebugUnitTest/TEST-com.celzero.bravedns.core.proxy.policy.InspectionTransportPolicyTest.xml
          if-no-files-found: error
          retention-days: 7
