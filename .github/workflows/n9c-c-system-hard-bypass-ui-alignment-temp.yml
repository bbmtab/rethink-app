name: N9C-C System Hard Bypass UI Alignment Verification

on:
  push:
    branches:
      - temp/n9c-c-system-hard-bypass-ui-alignment-20260905

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Neutralize local Windows Gradle Java home
        shell: bash
        run: |
          echo "Before:"
          grep -n '^org\.gradle\.java\.home=' gradle.properties || true

          sed -i \
            '/^org\.gradle\.java\.home=/d' \
            gradle.properties

          echo "After:"
          if grep -n '^org\.gradle\.java\.home=' gradle.properties; then
            echo "N9CC_JAVA_HOME_NEUTRALIZED=NO"
            exit 1
          fi

          echo "N9CC_JAVA_HOME_NEUTRALIZED=YES"
          echo "JAVA_HOME=$JAVA_HOME"
          java -version

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Compile fdroidFullDebug production Kotlin
        run: >
          ./gradlew
          :app:compileFdroidFullDebugKotlin
          --no-daemon
          --stacktrace

      - name: Run targeted tests
        run: >
          ./gradlew
          :app:testFdroidFullDebugUnitTest
          --tests
          "com.celzero.bravedns.core.proxy.policy.InspectionUserAppPolicyRepositoryTest"
          --tests
          "com.celzero.bravedns.core.proxy.policy.InspectionAppPolicyControllerTest"
          --no-daemon
          --stacktrace

      - name: Verify targeted JUnit totals
        shell: bash
        run: |
          python3 - <<'PY'
          import glob
          import sys
          import xml.etree.ElementTree as ET

          files = glob.glob(
              "app/build/test-results/"
              "testFdroidFullDebugUnitTest/*.xml"
          )

          if not files:
              print("N9CC_JUNIT_XML=NOT_FOUND")
              sys.exit(1)

          tests = 0
          failures = 0
          errors = 0
          skipped = 0

          for path in files:
              root = ET.parse(path).getroot()
              tests += int(root.attrib.get("tests", 0))
              failures += int(root.attrib.get("failures", 0))
              errors += int(root.attrib.get("errors", 0))
              skipped += int(root.attrib.get("skipped", 0))

          print(f"N9CC_TESTS={tests}")
          print(f"N9CC_FAILURES={failures}")
          print(f"N9CC_ERRORS={errors}")
          print(f"N9CC_SKIPPED={skipped}")

          if (tests, failures, errors, skipped) != (17, 0, 0, 0):
              sys.exit(1)
          PY

      - name: Assemble fdroidFullDebug APK
        run: >
          ./gradlew
          :app:assembleFdroidFullDebug
          --no-daemon
          --stacktrace

      - name: Upload universal APK
        uses: actions/upload-artifact@v4
        with:
          name: n9c-c-system-hard-bypass-ui-alignment-${{ github.sha }}
          path: app/build/outputs/apk/fdroidFull/debug/app-universal-debug.apk
          retention-days: 7